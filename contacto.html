<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos - O Meu Projeto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Menu de Navegação Superior -->
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="contacto.html" class="ativo" aria-current="page">Contactos</a></li>
            <li><button id="btn-tema">🌙 Modo Escuro</button></li>
        </ul>
    </nav>

    <header>
        <h1>Página de Contactos</h1>
        <p>Entre em contacto connosco!</p>
    </header>

    <main>
        <section class="card">
            <h2>Envie uma Mensagem</h2>

            <form id="formulario-contacto" class="formulario-contacto" action="https://formspree.io/f/xykvevle" method="POST">
                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="name" required autocomplete="name">
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="message" rows="4" required minlength="10"></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>

            <p id="resposta-formulario" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer class="rodape">
        <p>-- Desenvolvido por DARCEVENTS - @2026 --</p>
    </footer>

    <script src="script-contacto.js"></script>
</body>
</html>
